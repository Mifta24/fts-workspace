# Local development services. Not a production deployment.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fts
      POSTGRES_PASSWORD: fts_dev_password
      POSTGRES_DB: fts_workspace
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fts -d fts_workspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
